# Items promoted from this PRIVATE repo to a WORK plugin marketplace.
# This repo stays the source; the work copy is generated by tools\Promote-ToWork.ps1 and never edited there.
#
# A promoted item must stand alone for a coworker: no machine-profile {Key} paths, no personal hosts or
# accounts, no [[memory]] links, and no reference to a skill that is not promoted too.

# Text that must not appear in a promoted item (regex, case-insensitive).
blockedPatterns:
  - 'agenewe'
  - '\bgenewe\b'
  - 'genewebb'
  - 'CORPLTR94'
  - 'CORPVM17'
  - 'SMVMTR\d'
  - '[A-Z]:\\(Users|Deploy|scratch|tmp)\\'
  - '\\\\SynologyDS918'
  - '\[\[[a-z0-9_-]+\]\]'

# Folder names under skills\ and agents\ to promote.
skills: []
agents: []
