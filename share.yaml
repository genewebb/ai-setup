# Read by prof setup share (Gene.Profile\Share.ps1): text that must not travel to a coworker unnoticed.
# Every line of a staged share (profile files, skills) that matches one of these patterns (regex, case-insensitive)
# is listed with its file and line, and the share goes on only after a yes. Secrets are a different check
# (tools\Find-Secrets.ps1) and always stop the share.
blockedPatterns:
  - 'agenewe'
  - '\bgenewe\b'
  - 'genewebb'
  - 'CORPLTR94'
  - 'CORPVM17'
  - 'SMVMTR\d'
  - '[A-Z]:\\(Users|Deploy|scratch|tmp)\\'
  - '\\\\SynologyDS918'
  - '\[\[[a-z0-9_-]+\]\]'
